[package]
name = "obkv-table-client-rs"
version = "0.2.0"
authors = ["OceanBase OBKV Developers", "CeresDB Authors <ceresdbservice@gmail.com>"]
edition = "2018"

[workspace]
members = ["ycsb-rs"]

[workspace.package]
version = "0.2.0"
authors = ["OceanBase OBKV Developers", "CeresDB Authors <ceresdbservice@gmail.com>"]
edition = "2018"

[workspace.dependencies]
anyhow = "1.0"
log = "0.4"
prometheus-client = "0.21"
tokio = { version = "1", features = ["full"] }
toml = "0.4"

[lib]
name = "obkv"

[dependencies]
anyhow = { workspace = true }
backtrace = "0.2.3"
byteorder = "1.2"
bytes = "1.4"
chrono = "0.4"
crossbeam = "0.7.1"
futures = "0.1"
futures-cpupool = "0.1"
lazy_static = "1.3.0"
linked-hash-map = "0.5"
log = { workspace = true }
murmur2 = "0.1"
mysql = { version = "23.0.1", default-features = false, features = ["default-rustls"] }
net2 = "0.2"
pin-project-lite = "0.2"
prometheus-client = { workspace = true }
quick-error = "1.2"
r2d2 = "0.8.3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.11.13", default-features = false, features = ["rustls-tls", "blocking"] }
scheduled-thread-pool = "0.2.0"
serde = "1.0.81"
serde_bytes = "0.11"
serde_derive = "1.0.81"
serde_json = "1.0.34"
sha1 = "0.10.5"
socket2 = "0.5"
spin = "0.5.0"
tokio = { workspace = true }
tokio-util = ">=0.7, <0.7.9"
uuid = { version = "1.3.0", default-features = false, features = ["v4", "fast-rng", "macro-diagnostics"] }

# Pin indirect dependencies to versions compatible with Rust 1.69.0
parking_lot_core = ">=0.9, <0.9.9"
lock_api = ">=0.4, <0.4.12"
libloading = ">=0.8, <0.8.4"
url = ">=2.2, <2.5"
tokio-macros = ">=2.1, <2.3"
mio = ">=0.8, <1.0"
time03 = { version = ">=0.3, <0.3.37", package = "time" }
deranged = ">=0.3, <0.4"
time-core = ">=0.1, <0.1.3"
zstd = "0.12.3"

[dev-dependencies]
env_logger = "0.6"
scoped_threadpool = "0.1"
serial_test = "0.2"
serial_test_derive = "0.2"
tempfile = "3.0"
test-log = "0.2"
time = "0.1"
tokio-test = "0.4"

[[bench]]
name = "concurrent_insert"
harness = false
path = "benches/concurrent_insert/mod.rs"

[profile.release]
debug = true
